<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>生成图标</title></head>
<body style="font-family:sans-serif;padding:20px;">
  <h2>App 图标生成器</h2>
  <p>点击按钮生成所需尺寸的 PNG 图标（会自动下载）</p>
  <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
  <button onclick="generateIcons()" style="padding:12px 24px;font-size:16px;cursor:pointer;">🎨 生成所有图标</button>
  <ul id="log" style="margin-top:16px;"></ul>
  <script>
    // 使用 SVG 渲染图标到 Canvas
    async function renderIcon(size) {
      const canvas = document.getElementById('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 背景渐变
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#FFB6C1');
      grad.addColorStop(1, '#FF91A4');

      // 圆角背景
      const r = size * 0.08;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // 蛋糕 (emoji fallback)
      ctx.font = `${size * 0.55}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🍰', size / 2, size / 2);

      return canvas.toDataURL('image/png');
    }

    async function generateIcons() {
      const log = document.getElementById('log');
      log.innerHTML = '';
      const sizes = [192, 512];

      for (const size of sizes) {
        const dataUrl = await renderIcon(size);
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `icon-${size}.png`;
        a.click();
        log.innerHTML += `<li>✅ icon-${size}.png 已生成</li>`;
      }
      log.innerHTML += `<li>🎉 完成！将下载的文件放到 src/icons/ 目录下</li>`;
    }
  </script>
</body>
</html>
