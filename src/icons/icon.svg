  <!-- 爱心点缀 -->
  <text x="340" y="180" font-size="24" fill="#FF8899">♥</text>
  <text x="140" y="300" font-size="18" fill="#FFB6C1">♥</text>
  <text x="340" y="310" font-size="16" fill="#FFB6C1">♥</text>
