  <rect x="176" y="190" width="160" height="60" rx="12" fill="#FFE4E8" stroke="#FFB6C1" stroke-width="4"/>
  <!-- 奶油裱花 -->
  <circle cx="210" cy="240" r="14" fill="#FFF0F3"/>
  <circle cx="256" cy="240" r="14" fill="#FFF0F3"/>
  <circle cx="302" cy="240" r="14" fill="#FFF0F3"/>
  <circle cx="233" cy="238" r="12" fill="white"/>
  <circle cx="279" cy="238" r="12" fill="white"/>
  <!-- 草莓 -->
  <circle cx="256" cy="180" r="22" fill="#FF4466"/>
  <circle cx="248" cy="174" r="4" fill="#FF8899"/>
  <circle cx="264" cy="178" r="4" fill="#FF8899"/>
  <circle cx="256" cy="170" r="3" fill="#FF8899"/>
  <!-- 草莓叶子 -->
  <ellipse cx="248" cy="164" rx="8" ry="4" fill="#4CAF50" transform="rotate(-20 248 164)"/>
  <ellipse cx="264" cy="164" rx="8" ry="4" fill="#4CAF50" transform="rotate(20 264 164)"/>
  <ellipse cx="256" cy="162" rx="6" ry="3" fill="#66BB6A"/>
